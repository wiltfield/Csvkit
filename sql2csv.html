<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sql2csv — csvkit+</title>
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=VT323&display=block">
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="op-page">

  <main class="wrap">
    <a class="back-link" href="index.html">&larr; Back</a>

    <header class="intro">
      <h1 class="title">sql2csv</h1>
      <p class="lead">Run a SQL query against a connected database and save the results as a CSV.</p>
    </header>

    <div class="db-connect" id="db-connect">
      <button class="run-btn" type="button" id="db-connect-btn">Connect DB</button>
      <div class="db-status-row hidden" id="db-status-row">
        <span class="db-status-text">Connected to database</span>
        <button class="clear-btn" type="button" id="db-disconnect-btn">Disconnect</button>
      </div>
      <div class="save-box db-form" id="db-form">
        <label class="field-label" for="db-connstr-input">Neon connection string</label>
        <input class="text-input" type="text" id="db-connstr-input" placeholder="postgresql://user:pass@host/dbname">
        <div class="save-box-actions">
          <button class="run-btn" type="button" id="db-form-confirm">Connect</button>
          <button class="run-btn" type="button" id="db-form-cancel">Cancel</button>
        </div>
      </div>
      <div class="save-box db-confirm" id="db-disconnect-confirm">
        <p class="lead">Disconnect from this database?</p>
        <div class="save-box-actions">
          <button class="run-btn" type="button" id="db-disconnect-yes">Disconnect</button>
          <button class="run-btn" type="button" id="db-disconnect-no">Cancel</button>
        </div>
      </div>
    </div>

    <div class="options-panel visible" id="options-panel">
      <div class="field-row">
        <label class="field-label" for="query-input">SQL query</label>
        <textarea class="text-input textarea-input" id="query-input" placeholder="SELECT * FROM my_table;"></textarea>
      </div>
      <button class="run-btn" type="button" id="run-btn">Run query</button>
    </div>

    <section class="output-area" id="output-area" aria-live="polite"></section>

    <div class="action-row">
      <div class="save-row" id="save-row">
        <button class="save-btn" type="button" id="save-btn">Save</button>
      </div>
      <button class="clear-btn" type="button" id="clear-btn">Clear</button>
    </div>
    <div class="save-box" id="save-box">
      <label class="field-label" for="save-filename">Filename</label>
      <input class="text-input" type="text" id="save-filename" value="new.csv">
      <div class="save-box-actions">
        <button class="run-btn" type="button" id="save-confirm">Download</button>
        <button class="run-btn" type="button" id="save-cancel">Cancel</button>
      </div>
    </div>

    <div class="terminal" id="terminal"></div>
  </main>

  <footer class="site-footer">
    <button class="foot-link" type="button" data-action="about">About</button>
    <button class="foot-link" type="button" data-action="donate">Donate</button>
    <button class="foot-link theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
      Theme
      <span class="switch" aria-hidden="true">
        <span class="switch-track">
          <span class="switch-lever"></span>
        </span>
      </span>
    </button>
  </footer>

<script type="module" src="src/script.js"></script>
<script type="module" src="src/sql2csv.js"></script>
</body>
</html>
